<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Michael Vasyliev</title>
  <meta name="description" content="Personal website of Michael Vasyliev. Coming soon.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f7f5;
      color: #1d1d1f;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 650; letter-spacing: -0.02em; }
    p { margin-top: 1rem; font-size: 1.15rem; color: #5f5f63; line-height: 1.5; }
    .line { width: 3rem; height: 3px; margin: 1.5rem auto 0; background: #2f6fde; border-radius: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #141416; color: #f2f2f4; }
      p { color: #a1a1a6; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Michael Vasyliev</h1>
    <div class="line"></div>

</html>
